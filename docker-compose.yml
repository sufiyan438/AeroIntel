services:

  neo4j:
    image: neo4j:5
    container_name: aero-neo4j

    ports:
      - "7474:7474" #for browser port
      - "7687:7687" #bolt connection for application

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}

    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: